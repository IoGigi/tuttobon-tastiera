<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <title>TUTTOBON - QUANTO DEVI PAGARE ALLA CASSA?</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: light; --ink:#111827; --muted:#4b5563; --line:#cbd5e1; --paper:#f4f7fb; --white:#fff; --green:#128342; --red:#c62828; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:Arial,Helvetica,sans-serif; }
    body { min-height:100dvh; }
    .app { min-height:100dvh; width:100%; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; }
    .heading { font-size:clamp(19px,5vw,25px); line-height:1.15; font-weight:900; text-align:center; text-transform:uppercase; letter-spacing:.2px; }
    .display { background:var(--white); border:3px solid var(--line); border-radius:18px; min-height:110px; padding:14px 12px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:4px; box-shadow:0 2px 0 rgba(15,23,42,.06); }
    .display-label { font-size:15px; font-weight:900; text-transform:uppercase; color:var(--muted); }
    #amount { width:100%; text-align:center; font-size:clamp(38px,11vw,58px); line-height:1.1; font-weight:900; letter-spacing:1px; overflow-wrap:anywhere; min-height:1.1em; }
    .keys { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; flex:1; align-content:stretch; }
    button { appearance:none; border:2px solid #b8c4d3; border-radius:16px; background:var(--white); color:var(--ink); font-family:Arial,Helvetica,sans-serif; font-weight:900; box-shadow:0 3px 0 rgba(15,23,42,.12); cursor:pointer; touch-action:manipulation; }
    button:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(15,23,42,.12); filter:brightness(.94); }
    .digit { min-height:clamp(66px,11.2vh,94px); font-size:clamp(40px,12vw,64px); line-height:1; padding:4px 0; }
    .utility { min-height:62px; font-size:clamp(19px,5vw,25px); text-transform:uppercase; }
    .back { font-size:clamp(27px,8vw,40px); }
    .clear { background:#c62828; color:white; border-color:#9f1f1f; }
    .ok { background:#128342; color:white; border-color:#0c6632; min-height:70px; font-size:clamp(25px,7vw,34px); }
    .cancel { background:#e5e7eb; color:#111827; border-color:#9ca3af; min-height:58px; font-size:21px; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .hint { text-align:center; color:var(--muted); font-weight:800; font-size:13px; text-transform:uppercase; }
    @media (min-height:800px) { .digit { min-height:clamp(78px,12vh,108px); } .display { min-height:125px; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="heading">QUANTO DEVI PAGARE ALLA CASSA?</div>
    <section class="display" aria-live="polite">
      <div class="display-label">IMPORTO IN EURO</div>
      <div id="amount">0,00</div>
    </section>
    <section class="keys" aria-label="TASTIERINO NUMERICO">
      <button class="digit" data-key="1">1</button><button class="digit" data-key="2">2</button><button class="digit" data-key="3">3</button>
      <button class="digit" data-key="4">4</button><button class="digit" data-key="5">5</button><button class="digit" data-key="6">6</button>
      <button class="digit" data-key="7">7</button><button class="digit" data-key="8">8</button><button class="digit" data-key="9">9</button>
      <button class="utility" data-key="comma">,</button><button class="digit" data-key="0">0</button><button class="utility back" data-key="back" aria-label="CANCELLA ULTIMA CIFRA">⌫</button>
      <button class="utility clear" data-key="clear">SVUOTA</button><button class="ok" id="ok">OK</button><button class="cancel" id="cancel">ANNULLA</button>
    </section>
    <div class="hint">PREMI OK PER CONTINUARE</div>
  </main>
  <script>
    (() => {
      const tg = window.Telegram && window.Telegram.WebApp;
      const WORKER_AMOUNT_URL = "https://giftwallet-telegram.cl1981.workers.dev/miniapp/amount";
      if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#f4f7fb'); tg.setBackgroundColor('#f4f7fb'); } catch (_) {} }
      const amountEl = document.getElementById('amount');
      let value = '';
      let done = false;
      function show() { amountEl.textContent = value || '0,00'; }
      function tap() { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (_) {} }
      function addDigit(d) {
        if (done) return;
        const parts = value.split(',');
        if (!value.includes(',') && value.length >= 6) return;
        if (parts.length === 2 && parts[1].length >= 2) return;
        if (value === '0' && d !== '0') value = d;
        else value += d;
        show(); tap();
      }
      async function send(payload) {
        if (!tg || !tg.initData) {
          alert('APRI QUESTA TASTIERA DALL’INTERNO DEL BOT TELEGRAM.');
          return;
        }
        done = true;
        const okButton = document.getElementById('ok');
        const cancelButton = document.getElementById('cancel');
        okButton.disabled = true;
        cancelButton.disabled = true;
        try {
          const response = await fetch(WORKER_AMOUNT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData: tg.initData, action: payload.action, amount: payload.amount })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || !result.success) throw new Error(result.error || 'INVIO NON RIUSCITO');
          try { tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (_) {}
          tg.close();
        } catch (error) {
          done = false;
          okButton.disabled = false;
          cancelButton.disabled = false;
          alert(error.message || 'ERRORE DI INVIO. RIPROVA.');
        }
      }
      document.querySelectorAll('[data-key]').forEach(btn => btn.addEventListener('click', () => {
        const key = btn.dataset.key;
        if (/^\d$/.test(key)) addDigit(key);
        else if (key === 'comma' && !done && !value.includes(',')) { value = value ? value + ',' : '0,'; show(); tap(); }
        else if (key === 'back' && !done) { value = value.slice(0,-1); show(); tap(); }
        else if (key === 'clear' && !done) { value = ''; show(); tap(); }
      }));
      document.getElementById('ok').addEventListener('click', () => {
        if (!value || value === ',' || !/^\d{1,6}(?:,\d{1,2})?$/.test(value)) {
          amountEl.textContent = 'INSERISCI IMPORTO';
          tap(); return;
        }
        let normalized = value;
        if (normalized.endsWith(',')) normalized = normalized.slice(0,-1);
        send({action:'amount', amount:normalized});
      });
      document.getElementById('cancel').addEventListener('click', () => send({action:'cancel'}));
      show();
    })();
  </script>
</body>
</html>
